<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frames and Embedding Demo</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            display: grid;
            grid-template-columns: 30% 70%;
            grid-template-rows: 50% 50%;
            height: 100vh;
        }
        .frame {
            border: 2px solid #333;
        }
        .header {
            grid-column: 1 / 3;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>Webpage using Frames & Embedding</h1>
</div>

<div class="container">
    
    <!-- Left Frame: Navigation -->
    <div class="frame">
        <h3 style="text-align:center;">Navigation</h3>
        <ul>
            <li><a href="https://www.wikipedia.org" target="contentFrame">Wikipedia</a></li>
            <li><a href="https://www.example.com" target="contentFrame">Example</a></li>
            <li><a href="https://www.openai.com" target="contentFrame">OpenAI</a></li>
        </ul>
    </div>

    <!-- Right Top Frame: External Webpage -->
    <div class="frame">
        <iframe name="contentFrame" width="100%" height="100%" src="https://www.wikipedia.org"></iframe>
    </div>

    <!-- Bottom Left Frame: Info -->
    <div class="frame">
        <h3 style="text-align:center;">About</h3>
        <p style="padding:10px;">
            This section demonstrates usage of iframe as a frame replacement.
            You can load different external pages using the navigation links.
        </p>
    </div>

    <!-- Bottom Right Frame: Google Map -->
    <div class="frame">
        <iframe 
            src="https://www.google.com/maps?q=Nagpur&output=embed"
            width="100%" 
            height="100%" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy">
        </iframe>
    </div>

</div>

</body>
</html>
