<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock & Stopwatch</title>

    
    <link rel="stylesheet" href="./output.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100
             flex items-center justify-center p-5">

    <div class="w-full max-w-4xl">

        
        <div class="text-center mb-8">

            <div class="inline-flex items-center justify-center
                        w-20 h-20 rounded-full
                        bg-gradient-to-r from-purple-500 to-pink-500
                        shadow-lg mb-4">

                <span class="text-4xl">⏰</span>

            </div>

            <h1 class="text-4xl md:text-5xl font-extrabold
                       bg-gradient-to-r from-purple-600 via-pink-500 to-orange-500
                       bg-clip-text text-transparent">

                Digital Clock & Stopwatch

            </h1>

        </div>


        
        <div class="bg-white rounded-3xl p-6 md:p-8
                    shadow-xl border border-purple-100
                    mb-6">

            <div class="flex items-center justify-between mb-5">

                <h2 class="text-2xl font-bold text-purple-700">
                    🕐 Digital Clock
                </h2>

                <span class="bg-green-100 text-green-600
                             px-4 py-1 rounded-full
                             text-sm font-semibold">

                    ● LIVE

                </span>

            </div>


            
            <div class="bg-gradient-to-r from-indigo-500
                        via-purple-500 to-pink-500
                        rounded-2xl p-7
                        shadow-lg text-center">

                <div id="clock"
                     class="text-5xl md:text-7xl
                            font-mono font-bold
                            tracking-widest text-white">

                    00:00:00

                </div>

                <div id="date"
                     class="text-purple-100 mt-3 text-lg">

                    Loading...

                </div>

            </div>

        </div>


        
        <div class="bg-white rounded-3xl p-6 md:p-8
                    shadow-xl border border-blue-100
                    mb-6">

            <h2 class="text-2xl font-bold text-blue-600 mb-5">
                ⏱️ Stopwatch
            </h2>


            
            <div class="bg-gradient-to-r from-cyan-400
                        to-blue-500
                        rounded-2xl p-7
                        shadow-lg text-center mb-6">

                <div id="stopwatch"
                     class="text-4xl md:text-6xl
                            font-mono font-bold
                            tracking-widest text-white">

                    00:00:00

                </div>

            </div>


            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

                
                <button id="startBtn"
                        class="bg-gradient-to-r from-green-400 to-emerald-500
                               hover:from-green-500 hover:to-emerald-600
                               text-white font-bold
                               py-3 px-5 rounded-xl
                               shadow-md
                               transition duration-300
                               hover:-translate-y-1">

                    ▶ Start

                </button>


                
                <button id="stopBtn"
                        class="bg-gradient-to-r from-red-400 to-rose-500
                               hover:from-red-500 hover:to-rose-600
                               text-white font-bold
                               py-3 px-5 rounded-xl
                               shadow-md
                               transition duration-300
                               hover:-translate-y-1">

                    ■ Stop

                </button>


                
                <button id="resetBtn"
                        class="bg-gradient-to-r from-orange-400 to-amber-500
                               hover:from-orange-500 hover:to-amber-600
                               text-white font-bold
                               py-3 px-5 rounded-xl
                               shadow-md
                               transition duration-300
                               hover:-translate-y-1">

                    ↻ Reset

                </button>


                
                <button id="lapBtn"
                        class="bg-gradient-to-r from-purple-500 to-fuchsia-500
                               hover:from-purple-600 hover:to-fuchsia-600
                               text-white font-bold
                               py-3 px-5 rounded-xl
                               shadow-md
                               transition duration-300
                               hover:-translate-y-1">

                    ⚑ Lap

                </button>

            </div>

        </div>


        
        <div class="bg-white rounded-3xl p-6 md:p-8
                    shadow-xl border border-pink-100">

            <div class="flex items-center justify-between mb-5">

                <h2 class="text-2xl font-bold text-pink-600">
                    🏁 Lap Times
                </h2>

                <span id="lapCount"
                      class="bg-pink-100 text-pink-600
                             px-4 py-1 rounded-full
                             text-sm font-semibold">

                    0 Laps

                </span>

            </div>


            
            <div id="lapList">

                <p id="noLapMessage"
                   class="text-center text-gray-400 py-5">

                    No laps recorded yet

                </p>

            </div>

        </div>


        
        <div class="text-center mt-6">

            <p class="text-gray-500 text-sm">
                Digital Clock & Stopwatch
            </p>

            <p class="text-purple-500 font-semibold text-sm mt-1">
                Khushi@2026
            </p>

        </div>

    </div>


    
    <script>

        

        function updateClock() {

            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");

            document.getElementById("clock").textContent =
                hours + ":" + minutes + ":" + seconds;


            const options = {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            };

            document.getElementById("date").textContent =
                now.toLocaleDateString("en-US", options);

        }

        
        setInterval(updateClock, 1000);

        
        updateClock();


        

        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let running = false;
        let lapTotal = 0;

        const stopwatch =
            document.getElementById("stopwatch");

        const startBtn =
            document.getElementById("startBtn");

        const stopBtn =
            document.getElementById("stopBtn");

        const resetBtn =
            document.getElementById("resetBtn");

        const lapBtn =
            document.getElementById("lapBtn");

        function updateButtonStates() {
            const isRunning = running;

            startBtn.disabled = isRunning;
            stopBtn.disabled = !isRunning;
            lapBtn.disabled = !isRunning;

            startBtn.classList.toggle("opacity-50", isRunning);
            stopBtn.classList.toggle("opacity-50", !isRunning);
            lapBtn.classList.toggle("opacity-50", !isRunning);

            startBtn.classList.toggle("cursor-not-allowed", isRunning);
            stopBtn.classList.toggle("cursor-not-allowed", !isRunning);
            lapBtn.classList.toggle("cursor-not-allowed", !isRunning);
        }

        function clearLapMessage() {
            const noLapMessage = document.getElementById("noLapMessage");
            if (noLapMessage) {
                noLapMessage.remove();
            }
        }

        function updateLapCount() {
            document.getElementById("lapCount").textContent =
                lapTotal + (lapTotal === 1 ? " Lap" : " Laps");
        }


        
        function formatTime(time) {

            let hours =
                Math.floor(time / 3600000);

            let minutes =
                Math.floor((time % 3600000) / 60000);

            let seconds =
                Math.floor((time % 60000) / 1000);


            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");


            return hours + ":" + minutes + ":" + seconds;

        }


        
        function updateStopwatch() {

            elapsedTime =
                Date.now() - startTime;

            stopwatch.textContent =
                formatTime(elapsedTime);

        }


        
        startBtn.addEventListener("click", function () {

            if (!running) {

                startTime =
                    Date.now() - elapsedTime;

                timerInterval =
                    setInterval(updateStopwatch, 100);

                running = true;
                updateButtonStates();

            }

        });


        
        stopBtn.addEventListener("click", function () {

            if (running) {

                clearInterval(timerInterval);

                running = false;
                updateButtonStates();

            }

        });


        
        resetBtn.addEventListener("click", function () {

            clearInterval(timerInterval);

            elapsedTime = 0;
            lapTotal = 0;

            running = false;
            updateButtonStates();

            stopwatch.textContent =
                "00:00:00";

            document.getElementById("lapList").innerHTML =
                '<p id="noLapMessage" class="text-center text-gray-400 py-5">' +
                'No laps recorded yet' +
                '</p>';

            updateLapCount();

        });

        updateButtonStates();


        

        lapBtn.addEventListener("click", function () {

            if (!running) {
                return;
            }

            const lapList = document.getElementById("lapList");
            clearLapMessage();

            lapTotal += 1;
            const lapNumber = lapTotal;
            const lapTime = formatTime(elapsedTime);

            const styles = [
                "from-purple-50 to-pink-50 border-purple-100 text-purple-600 bg-purple-500",
                "from-blue-50 to-cyan-50 border-blue-100 text-blue-600 bg-blue-500",
                "from-orange-50 to-yellow-50 border-orange-100 text-orange-600 bg-orange-500"
            ];

            const style = styles[(lapNumber - 1) % styles.length].split(" ");

            const lapItem = document.createElement("div");
            lapItem.className =
                "lap-item flex items-center justify-between " +
                "bg-gradient-to-r " +
                style[0] + " " + style[1] +
                " border " + style[2] +
                " rounded-xl p-4 mb-3 " +
                "hover:shadow-md transition";

            lapItem.innerHTML = `
                <div class="flex items-center gap-3">
                    <span class="w-10 h-10
                                 flex items-center justify-center
                                 rounded-full
                                 ${style[4]}
                                 text-white font-bold">
                        ${lapNumber}
                    </span>
                    <span class="font-semibold text-gray-700">
                        Lap ${lapNumber}
                    </span>
                </div>
                <span class="font-mono font-bold ${style[3]}">
                    ${lapTime}
                </span>
            `;

            lapList.prepend(lapItem);
            updateLapCount();

        });

    </script>

</body>

</html>
